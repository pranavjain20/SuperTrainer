services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: supertrainer
      POSTGRES_PASSWORD: supertrainer
      POSTGRES_DB: supertrainer
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supertrainer"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: supertrainer_test
      POSTGRES_PASSWORD: supertrainer_test
      POSTGRES_DB: supertrainer_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supertrainer_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
